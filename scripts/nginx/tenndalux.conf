server {
    listen 80;
    server_name tenndalux.projectapp.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tenndalux.projectapp.co;

    ssl_certificate /etc/letsencrypt/live/tenndalux.projectapp.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenndalux.projectapp.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Keep conventional browser requests on the same published brand icon.
    location = /favicon.ico {
        return 302 /static/favicon.ico?v=tenndalux-2;
    }

    location /_next/ {
        alias /home/ryzepeck/webapps/tenndalux_project/backend/static/_next/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /videos/ {
        alias /home/ryzepeck/webapps/tenndalux_project/backend/static/videos/;
        expires 30d;
    }

    location /home/ {
        alias /home/ryzepeck/webapps/tenndalux_project/backend/static/home/;
        expires 30d;
    }

    location /products/ {
        alias /home/ryzepeck/webapps/tenndalux_project/backend/static/products/;
        expires 30d;
    }

    # Legal PDFs linked from the footer. Without this block they fall through to
    # `location /`, and gunicorn cannot serve them: the ^legal/ route in
    # core_project/urls.py only exists under DEBUG, so production answers 404.
    location /legal/ {
        alias /home/ryzepeck/webapps/tenndalux_project/backend/static/legal/;
        expires 30d;
    }

    # Assets sitting at the root of the Next.js public/ folder (logo, svgs,
    # favicon, RSC payload .txt). Single-segment regex, so it never shadows
    # /home/, /products/, /legal/, /static/ or /media/.
    location ~* ^/[^/]+\.(png|jpe?g|webp|svg|ico|txt|xml|webmanifest)$ {
        root /home/ryzepeck/webapps/tenndalux_project/backend/static;
        expires 30d;
    }

    location /static/ {
        alias /home/ryzepeck/webapps/tenndalux_project/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/ryzepeck/webapps/tenndalux_project/backend/media/;
        expires 7d;
    }

    location /api/ {
        include /etc/nginx/snippets/geo-block.conf;
        limit_req zone=api burst=10 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/tenndalux_gunicorn.sock;
    }

    location / {
        include /etc/nginx/snippets/geo-block.conf;
        limit_req zone=general burst=20 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/tenndalux_gunicorn.sock;
    }
}
