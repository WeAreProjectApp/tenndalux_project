name: Hosting document adapter
on:
  pull_request:
    branches: [main, master]
jobs:
  document-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev ffmpeg
          pip install -r requirements.txt
      - name: Verify hosting document adapter
        run: pytest core_app/tests/test_hosting_guard.py --no-cov -q
